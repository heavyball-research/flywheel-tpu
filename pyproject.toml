[project]
name = "flywheel-tpu"
version = "0.1.0"
description = "FlyWheel: attention kernels for TPU, implemented in JAX Pallas"
dynamic = ["readme"]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "heavyball-research" }]
keywords = ["jax", "pallas", "tpu", "attention", "flash-attention", "linear-attention"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "jax>=0.11.0",
]

[project.urls]
Homepage = "https://github.com/heavyball-research/flywheel-tpu"
Repository = "https://github.com/heavyball-research/flywheel-tpu"
Issues = "https://github.com/heavyball-research/flywheel-tpu/issues"

[project.optional-dependencies]
# jax[tpu] pulls the libtpu that matches its jax version.
tpu = ["jax[tpu]>=0.11.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flywheel_tpu"]

# Only what the wheel build needs; third_party/, benchmarks/, tests/ stay out.
[tool.hatch.build.targets.sdist]
include = ["/flywheel_tpu", "/README.md", "/LICENSE"]

# PyPI cannot resolve README-relative paths: rewrite them to GitHub URLs at build time.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

# Images -> raw URLs.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '(src|srcset)="(assert/[^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/heavyball-research/flywheel-tpu/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((assert/[^)]+)\)'
replacement = '](https://raw.githubusercontent.com/heavyball-research/flywheel-tpu/main/\1)'

# Remaining relative links -> GitHub blob pages.
[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#)([^)]+)\)'
replacement = '](https://github.com/heavyball-research/flywheel-tpu/blob/main/\1)'
