[project]
name = "flywheel-tpu"
version = "0.1.0"
description = "FlyWheel: attention kernels for TPU, implemented in JAX Pallas"
requires-python = ">=3.12"
dependencies = [
    "jax==0.11.0",
]

[project.optional-dependencies]
# The stack tpu-inference runs; jax[tpu] alone would take libtpu 0.0.44.1.
tpu = ["jax[tpu]==0.11.0", "libtpu==0.0.44"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flywheel_tpu"]
